[alembic]
# Alembic migration scripts live in this folder.
script_location = migrations
prepend_sys_path = .
# migrations/env.py replaces this with the URL from app.config.settings.
sqlalchemy.url = postgresql+psycopg://app:app_password@db:5432/async_tasks

# Logging below controls the messages printed while migrations run.
[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers = console
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
