name: tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: async_tasks, POSTGRES_USER: app, POSTGRES_PASSWORD: app_password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d async_tasks"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app_password@localhost:5432/async_tasks
      SECRET_KEY: ci-test-secret-change-this-value
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check app tests migrations
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing
